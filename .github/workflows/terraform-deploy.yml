
name: Terraform EKS deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "I approve deploying the infrastructure with Terraform"
        required: true
        type: boolean
        default: false
      tags_only:
        description: "Apply only the five EC2 worker Name tags"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: Terraform plan and deployment
    runs-on: ubuntu-latest

    env:
      TAGS_ONLY: ${{ inputs.tags_only }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Generate Terraform plan
        run: |
          if [ "$TAGS_ONLY" = "true" ]; then
            terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan \
              -target='aws_ec2_tag.eks_worker_names["i-0e20491afd9b6d9fc"]' \
              -target='aws_ec2_tag.eks_worker_names["i-0a5172bbbd5666413"]' \
              -target='aws_ec2_tag.eks_worker_names["i-0c710f5ce40b27b63"]' \
              -target='aws_ec2_tag.eks_worker_names["i-049b05afb9714ca4c"]' \
              -target='aws_ec2_tag.eks_worker_names["i-04136588889405e05"]'
          else
            terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
          fi

      - name: Check deployment approval
        run: |
          echo "Approval input: ${{ inputs.confirm_deploy }}"
          echo "Tags-only input: ${{ inputs.tags_only }}"

      - name: Apply Terraform plan
        if: ${{ inputs.confirm_deploy == true }}
        run: terraform apply -input=false tfplan
