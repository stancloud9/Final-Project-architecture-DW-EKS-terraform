name: Inspect Kubernetes Ingress

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::910965283770:role/github-actions-terraform
          aws-region: us-east-2

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Inspect Kubernetes
        run: |
          aws eks update-kubeconfig --region us-east-2 --name stancloud-eks

          echo "=== NGINX SERVICE ==="
          kubectl get svc nginx-ingress-controller -n nginx-ingress -o yaml

          echo "=== NGINX PODS ==="
          kubectl get pods -n nginx-ingress -o wide

          echo "=== NGINX DEPLOYMENTS ==="
          kubectl get deployments -n nginx-ingress -o wide

          echo "=== INGRESS CLASSES ==="
          kubectl get ingressclass -o yaml

          echo "=== ARGOCD PODS ==="
          kubectl get pods -n argocd -o wide

          echo "=== ALL INGRESS RESOURCES ==="
          kubectl get ingress -A
