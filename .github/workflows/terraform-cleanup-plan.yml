
name: Terraform stale-lock recovery and destroy plan

on:
  workflow_dispatch:
    inputs:
      confirm_unlock:
        description: "I confirm all other Terraform jobs are stopped and approve removing the stale lock"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  cleanup-plan:
    name: Unlock state and create destroy plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Verify unlock approval
        if: ${{ inputs.confirm_unlock != true }}
        run: |
          echo "Unlock approval was not selected."
          exit 1

      - name: Remove stale Terraform lock
        run: terraform force-unlock -force 930a53fa-a202-5d99-2116-3ddc19bfe6db

      - name: Generate destroy plan only
        run: terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=tf-destroy.tfplan

      - name: Display destroy plan
        run: terraform show -no-color tf-destroy.tfplan
