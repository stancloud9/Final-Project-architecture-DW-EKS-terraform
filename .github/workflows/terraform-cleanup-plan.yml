
name: Terraform destroy approved infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "I approve destroying the 39 Terraform-managed resources"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  destroy:
    name: Plan and destroy approved infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Generate destroy plan
        run: terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=tf-destroy.tfplan

      - name: Display destroy plan
        run: terraform show -no-color tf-destroy.tfplan

      - name: Verify destroy plan scope
        shell: bash
        run: |
          terraform show -json tf-destroy.tfplan > tf-destroy.json
          destroy_count=$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' tf-destroy.json)
          s3_count=$(jq '[.resource_changes[] | select(.type == "aws_s3_bucket" or .type == "aws_s3_object")] | length' tf-destroy.json)

          echo "Resources to destroy: $destroy_count"
          echo "S3 resources in plan: $s3_count"

          if [ "$destroy_count" -ne 39 ]; then
            echo "Expected exactly 39 deletions; stopping for review."
            exit 1
          fi

          if [ "$s3_count" -ne 0 ]; then
            echo "S3 resources detected; refusing to apply."
            exit 1
          fi

      - name: Execute approved destroy plan
        if: ${{ github.event.inputs.confirm_destroy == 'true' }}
        run: terraform apply -input=false -no-color tf-destroy.tfplan
