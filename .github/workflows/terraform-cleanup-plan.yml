
name: Terraform destroy approved infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "I approve destroying the remaining Terraform-managed resources"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  destroy:
    name: Plan and destroy approved infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Generate destroy plan
        run: terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=tf-destroy.tfplan

      - name: Display destroy plan
        run: terraform show -no-color tf-destroy.tfplan

      - name: Verify destroy plan scope
        shell: bash
        run: |
          set -euo pipefail

          terraform show -json tf-destroy.tfplan > tf-destroy.json

          destroy_count=$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' tf-destroy.json)

          non_delete_count=$(jq '[.resource_changes[] | select(.change.actions != ["delete"])] | length' tf-destroy.json)

          s3_count=$(jq '[.resource_changes[] | select(.type | startswith("aws_s3_"))] | length' tf-destroy.json)

          s3_addresses=$(jq -r '[.resource_changes[] | select(.type | startswith("aws_s3_")) | .address] | sort | join(",")' tf-destroy.json)

          ecr_count=$(jq '[.resource_changes[] | select(.type | startswith("aws_ecr_"))] | length' tf-destroy.json)

          echo "Resources to destroy: $destroy_count"
          echo "Non-delete actions: $non_delete_count"
          echo "S3 resources in plan: $s3_count"
          echo "S3 resource addresses: $s3_addresses"
          echo "ECR resources in plan: $ecr_count"

          echo "Resources scheduled for deletion:"
          jq -r '.resource_changes[] | select(.change.actions == ["delete"]) | .address' tf-destroy.json

          if [ "$destroy_count" -ne 59 ]; then
            echo "Expected exactly 59 deletions; stopping for review."
            exit 1
          fi

          if [ "$non_delete_count" -ne 0 ]; then
            echo "Unexpected non-delete actions detected; refusing to apply."
            exit 1
          fi

          if [ "$s3_count" -ne 1 ] || [ "$s3_addresses" != "aws_s3_object.kubeconfig" ]; then
            echo "Unexpected S3 resources detected; refusing to apply."
            exit 1
          fi

          if [ "$ecr_count" -ne 0 ]; then
            echo "ECR resources detected; refusing to apply."
            exit 1
          fi

          echo "Destroy plan scope verified successfully."

      - name: Execute approved destroy plan
        if: ${{ inputs.confirm_destroy == true }}
        run: terraform apply -input=false -no-color tf-destroy.tfplan
